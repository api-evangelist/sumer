name: Sumer
description: 'Sumer (Sumer.Money) is a blockchain liquidity infrastructure protocol positioning
  itself as the most capital-efficient way to put crypto assets to work across chains. Users
  deposit native assets such as liquid staked ETH, and Sumer''s correlation-aware risk engine
  matches assets and liabilities to mint synthetic suTokens (suETH, suUSD) that act as "money
  multipliers" — travelling across connected blockchains as collateral while the underlying
  deposit keeps accruing staking rewards and lending interest. The protocol runs an omnichain
  lending/borrowing market, a points and veSumer staking program, and its Supernova EVM chain,
  drawing price data from Chainlink, Pyth, RedStone, and Supra oracles. Backed by Pantera Capital
  and other crypto investors, with contracts audited by Certik, Ancilia, Tikkala, and CD Security.'
